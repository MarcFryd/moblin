name: All

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  all:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
      - name: Create user config
        run: |
          cp User.template.xcconfig Config/User.xcconfig
      - name: Install just
        run: |
          brew install just
      - name: Source code styling
        run: |
          brew install swiftformat oxfmt
          just style-check
      - name: Linting
        run: |
          brew install swiftlint oxlint
          just lint
      - name: Spell checking
        run: |
          brew install codespell
          just spell-check
      - name: Web remote control frontend
        run: |
          just web-remote-control-frontend-prepare
          just web-remote-control-frontend-build
          git diff --exit-code
      - name: Build
        run: |
          rustup toolchain install stable --profile minimal
          RUSTUP_TOOLCHAIN=stable CARGO_BUILD_JOBS=3 sh WagaWebRTC/scripts/build-xcframework.sh
          xcodebuild \
              -scheme Moblin \
              -destination 'generic/platform=iOS' \
              -skipPackagePluginValidation \
              build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
